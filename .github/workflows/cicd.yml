name: ML Pipeline & Deploy (CI/CD)

on:
  push:
    branches: [dev]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  pipeline:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Terraform outputs into env
        run: |
          python3 - << 'PY'
          import json, os
          out = "terraform/outputs.json"
          if not os.path.isfile(out):
            print("::error::" + out + " not found. Run 'cd terraform && terraform output -json > outputs.json' and commit.")
            exit(1)
          with open(out, "rb") as f:
            raw_bytes = f.read().replace(b"\x00", b"")
          if raw_bytes.startswith(b"\xef\xbb\xbf"):
            raw = raw_bytes[3:].decode("utf-8")
          elif raw_bytes.startswith(b"\xff\xfe") or raw_bytes.startswith(b"\xfe\xff"):
            rest = raw_bytes[2:]
            try:
              raw = rest.decode("utf-8")
            except UnicodeDecodeError:
              raw = rest.decode("utf-16-le" if raw_bytes.startswith(b"\xff\xfe") else "utf-16-be")
          else:
            raw = raw_bytes.decode("utf-8")
          raw = raw.replace("\r", "")
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("::error::" + out + " is not valid JSON:", e)
            exit(1)
          def v(k):
            return (data.get(k) or {}).get("value") or ""
          env_file = os.environ.get("GITHUB_ENV")
          required = ["project_id", "table_id"]
          for key in required:
            if not v(key):
              print("::error::Missing output in " + out + ": " + key + ". Re-run 'terraform output -json > terraform/outputs.json' and commit.")
              exit(1)
          for name, key in [("GCP_PROJECT", "project_id"), ("DATA_BUCKET", "data_bucket"), ("ARTIFACTS_BUCKET", "artifacts_bucket"), ("DATASET_ID", "dataset_id"), ("TABLE_ID", "table_id")]:
            with open(env_file, "a") as ef:
              ef.write(name + "=" + v(key) + "\n")
          PY

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt

      - name: Run ML pipeline
        run: python ML-code/run_pipeline.py
        env:
          GCP_PROJECT:      ${{ env.GCP_PROJECT }}
          DATA_BUCKET:      ${{ env.DATA_BUCKET }}
          ARTIFACTS_BUCKET: ${{ env.ARTIFACTS_BUCKET }}
          DATASET_ID:       ${{ env.DATASET_ID }}
          TABLE_ID:         ${{ env.TABLE_ID }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt
      - run: python -m pytest tests/ -v

  deploy:
    needs: [pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load Terraform outputs into env
        run: |
          python3 - << 'PY'
          import json, os
          out = "terraform/outputs.json"
          if not os.path.isfile(out):
            print("::error::" + out + " not found. Run 'cd terraform && terraform output -json > outputs.json' and commit.")
            exit(1)
          with open(out, "rb") as f:
            raw_bytes = f.read().replace(b"\x00", b"")
          if raw_bytes.startswith(b"\xef\xbb\xbf"):
            raw = raw_bytes[3:].decode("utf-8")
          elif raw_bytes.startswith(b"\xff\xfe") or raw_bytes.startswith(b"\xfe\xff"):
            rest = raw_bytes[2:]
            try:
              raw = rest.decode("utf-8")
            except UnicodeDecodeError:
              raw = rest.decode("utf-16-le" if raw_bytes.startswith(b"\xff\xfe") else "utf-16-be")
          else:
            raw = raw_bytes.decode("utf-8")
          raw = raw.replace("\r", "")
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("::error::" + out + " is not valid JSON:", e)
            exit(1)
          def v(k):
            return (data.get(k) or {}).get("value") or ""
          env_file = os.environ.get("GITHUB_ENV")
          required = ["project_id", "artifact_repo_url", "runtime_service_account"]
          for key in required:
            if not v(key):
              print("::error::Missing output in " + out + ": " + key + ". Re-run 'terraform output -json > terraform/outputs.json' and commit.")
              exit(1)
          for name, key in [("GCP_PROJECT", "project_id"), ("ARTIFACTS_BUCKET", "artifacts_bucket"), ("REGION", "region"), ("ARTIFACT_REPO_URL", "artifact_repo_url"), ("RUNTIME_SERVICE_ACCOUNT", "runtime_service_account")]:
            with open(env_file, "a") as ef:
              ef.write(name + "=" + v(key) + "\n")
          PY

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          REPO="${{ env.ARTIFACT_REPO_URL }}"
          IMG="$REPO/app:${{ github.sha }}"
          echo "Building $IMG"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        run: |
          gcloud run deploy app \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "GCP_PROJECT=${{ env.GCP_PROJECT }},ARTIFACTS_BUCKET=${{ env.ARTIFACTS_BUCKET }}"
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT }}

  push-code:
    name: Push to next branch
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with push permission)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Read config and check push_to_next_branch
        id: config
        run: |
          python3 - << 'PY'
          import re, os
          with open("config.yaml", "r", encoding="utf-8") as f:
            c = f.read()
          m = re.search(r"push_to_next_branch:\s*(true|false)", c, re.I)
          push = m.group(1).lower() == "true" if m else False
          m2 = re.search(r'next_branch_name:\s*["\']?([a-zA-Z0-9_\-]+)["\']?', c)
          next_branch = (m2.group(1).strip() if m2 else "") or "qa"
          env_file = os.environ.get("GITHUB_ENV")
          with open(env_file, "a") as ef:
            ef.write(f"PUSH_TO_NEXT_BRANCH={str(push).lower()}\n")
            ef.write(f"NEXT_BRANCH_NAME={next_branch}\n")
          if not push:
            print("push_to_next_branch is not true; skipping push-code.")
            exit(0)
          PY

      - name: Fetch and push to next branch
        if: env.PUSH_TO_NEXT_BRANCH == 'true'
        run: |
          CURRENT="${{ github.ref_name }}"
          NEXT="${{ env.NEXT_BRANCH_NAME }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git branch -r | grep -q "origin/$NEXT"; then
            echo "Branch origin/$NEXT exists: merge $CURRENT into $NEXT and push."
            git checkout "$NEXT"
            git merge "$CURRENT" -m "chore: merge $CURRENT into $NEXT [skip ci]"
            git push origin "$NEXT"
          else
            echo "Branch $NEXT does not exist: create from $CURRENT and push."
            git checkout -b "$NEXT"
            git push -u origin "$NEXT"
          fi
