name: ML Pipeline & Deploy (CI/CD)

# Runs on dev, qa, prod. ACTIVE_ENV is set from branch name so config.yaml picks the right env block.
on:
  push:
    branches: [dev, qa, prod]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt
      - run: python -m pytest tests/ -v

  pipeline:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Set active environment from branch (dev/qa/prod). ML config_loader uses ACTIVE_ENV.
      - name: Set ACTIVE_ENV from branch
        run: echo "ACTIVE_ENV=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Load Terraform outputs into env
        run: |
          python3 - << 'PY'
          import json, os
          out = "terraform/terraform-output.json"
          if not os.path.isfile(out):
            print("::error::" + out + " not found. Run 'cd terraform && terraform output -json > terraform-output.json' and commit.")
            exit(1)
          with open(out, "rb") as f:
            raw_bytes = f.read().replace(b"\x00", b"")
          if raw_bytes.startswith(b"\xef\xbb\xbf"):
            raw = raw_bytes[3:].decode("utf-8")
          elif raw_bytes.startswith(b"\xff\xfe") or raw_bytes.startswith(b"\xfe\xff"):
            rest = raw_bytes[2:]
            try:
              raw = rest.decode("utf-8")
            except UnicodeDecodeError:
              raw = rest.decode("utf-16-le" if raw_bytes.startswith(b"\xff\xfe") else "utf-16-be")
          else:
            raw = raw_bytes.decode("utf-8")
          raw = raw.replace("\r", "")
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("::error::" + out + " is not valid JSON:", e)
            exit(1)
          def v(k):
            return (data.get(k) or {}).get("value") or ""
          env_file = os.environ.get("GITHUB_ENV")
          required = ["project_id", "table_id"]
          for key in required:
            if not v(key):
              print("::error::Missing output in " + out + ": " + key + ". Re-run 'terraform output -json > terraform/terraform-output.json' and commit.")
              exit(1)
          for name, key in [("GCP_PROJECT", "project_id"), ("DATA_BUCKET", "data_bucket"), ("ARTIFACTS_BUCKET", "artifacts_bucket"), ("DATASET_ID", "dataset_id"), ("TABLE_ID", "table_id")]:
            with open(env_file, "a") as ef:
              ef.write(name + "=" + v(key) + "\n")
          PY

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"
          cache-dependency-path: ML-code/requirements.txt

      - run: pip install -r ML-code/requirements.txt

      - name: Run ML pipeline
        run: python ML-code/run_pipeline.py
        env:
          ACTIVE_ENV:       ${{ env.ACTIVE_ENV }}
          GCP_PROJECT:      ${{ env.GCP_PROJECT }}
          DATA_BUCKET:      ${{ env.DATA_BUCKET }}
          ARTIFACTS_BUCKET: ${{ env.ARTIFACTS_BUCKET }}
          DATASET_ID:       ${{ env.DATASET_ID }}
          TABLE_ID:         ${{ env.TABLE_ID }}

  deploy:
    needs: [pipeline]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set ACTIVE_ENV from branch
        run: echo "ACTIVE_ENV=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Load Terraform outputs into env
        run: |
          python3 - << 'PY'
          import json, os
          out = "terraform/terraform-output.json"
          if not os.path.isfile(out):
            print("::error::" + out + " not found. Run 'cd terraform && terraform output -json > terraform-output.json' and commit.")
            exit(1)
          with open(out, "rb") as f:
            raw_bytes = f.read().replace(b"\x00", b"")
          if raw_bytes.startswith(b"\xef\xbb\xbf"):
            raw = raw_bytes[3:].decode("utf-8")
          elif raw_bytes.startswith(b"\xff\xfe") or raw_bytes.startswith(b"\xfe\xff"):
            rest = raw_bytes[2:]
            try:
              raw = rest.decode("utf-8")
            except UnicodeDecodeError:
              raw = rest.decode("utf-16-le" if raw_bytes.startswith(b"\xff\xfe") else "utf-16-be")
          else:
            raw = raw_bytes.decode("utf-8")
          raw = raw.replace("\r", "")
          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("::error::" + out + " is not valid JSON:", e)
            exit(1)
          def v(k):
            return (data.get(k) or {}).get("value") or ""
          env_file = os.environ.get("GITHUB_ENV")
          required = ["project_id", "artifact_repo_url", "runtime_service_account"]
          for key in required:
            if not v(key):
              print("::error::Missing output in " + out + ": " + key + ". Re-run 'terraform output -json > terraform/terraform-output.json' and commit.")
              exit(1)
          for name, key in [("GCP_PROJECT", "project_id"), ("ARTIFACTS_BUCKET", "artifacts_bucket"), ("REGION", "region"), ("ARTIFACT_REPO_URL", "artifact_repo_url"), ("RUNTIME_SERVICE_ACCOUNT", "runtime_service_account")]:
            with open(env_file, "a") as ef:
              ef.write(name + "=" + v(key) + "\n")
          PY

      - name: Load Cloud Run config from config.yaml
        run: |
          pip install --quiet pyyaml
          python3 - << 'PY'
          import os
          import yaml

          active_env = os.environ.get("ACTIVE_ENV", "dev").strip()
          with open("config.yaml", "r", encoding="utf-8") as f:
            data = yaml.safe_load(f) or {}

          envs = data.get("environments") or {}
          block = envs.get(active_env) or {}
          cr = block.get("cloud_run") or {}

          def get(key, default):
            v = cr.get(key)
            return str(default if v is None else v)

          # Sensible defaults if a field is missing for an env.
          min_instances = get("min_instances", 0)
          max_instances = get("max_instances", 10)
          cpu = get("cpu", 1)
          memory = cr.get("memory") or "512Mi"
          timeout_seconds = get("timeout_seconds", 300)
          concurrency = get("concurrency", 80)

          env_file = os.environ["GITHUB_ENV"]
          with open(env_file, "a") as ef:
            ef.write(f"CR_MIN_INSTANCES={min_instances}\n")
            ef.write(f"CR_MAX_INSTANCES={max_instances}\n")
            ef.write(f"CR_CPU={cpu}\n")
            ef.write(f"CR_MEMORY={memory}\n")
            ef.write(f"CR_TIMEOUT_SECONDS={timeout_seconds}\n")
            ef.write(f"CR_CONCURRENCY={concurrency}\n")
          PY

      - name: Auth to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Docker auth
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        run: |
          REPO="${{ env.ARTIFACT_REPO_URL }}"
          IMG="$REPO/app:${{ github.sha }}"
          echo "Building $IMG"
          docker build -t "$IMG" .
          docker push "$IMG"
          echo "IMAGE=$IMG" >> $GITHUB_ENV

      - name: Deploy Cloud Run
        run: |
          # Cloud Run deployment flags (per env from config.yaml):
          # --image            : commit-SHA image in Artifact Registry
          # --region           : region from Terraform outputs
          # --service-account  : runtime SA from Terraform outputs
          # --set-env-vars     : app config (project, bucket, ACTIVE_ENV)
          # --min-instances    : baseline instances to keep warm (per env)
          # --max-instances    : max autoscaled instances (per env)
          # --cpu / --memory   : instance sizing for model inference (per env)
          # --timeout          : request timeout in seconds
          # --concurrency      : how many requests each instance handles in parallel
          gcloud run deploy app \
            --image "${{ env.IMAGE }}" \
            --region "${{ env.REGION }}" \
            --platform managed \
            --allow-unauthenticated \
            --service-account "${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
            --set-env-vars "GCP_PROJECT=${{ env.GCP_PROJECT }},ARTIFACTS_BUCKET=${{ env.ARTIFACTS_BUCKET }},ACTIVE_ENV=${{ env.ACTIVE_ENV }}" \
            --min-instances "${{ env.CR_MIN_INSTANCES }}" \
            --max-instances "${{ env.CR_MAX_INSTANCES }}" \
            --cpu "${{ env.CR_CPU }}" \
            --memory "${{ env.CR_MEMORY }}" \
            --timeout "${{ env.CR_TIMEOUT_SECONDS }}" \
            --concurrency "${{ env.CR_CONCURRENCY }}"
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT }}

  push-code:
    name: Push to next branch
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (with push permission)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      # Active env = branch name (dev/qa/prod). CI/CD options are per-env in config.yaml.
      - name: Set ACTIVE_ENV from branch
        run: echo "ACTIVE_ENV=${{ github.ref_name }}" >> $GITHUB_ENV

      - name: Read per-env CI/CD config (push_to_next_branch, next_branch_name)
        run: |
          pip install --quiet pyyaml
          python3 - << 'PY'
          import os
          import yaml

          active_env = os.environ.get("ACTIVE_ENV", "dev").strip()
          with open("config.yaml", "r", encoding="utf-8") as f:
            data = yaml.safe_load(f) or {}

          environments = data.get("environments") or {}
          if active_env not in environments:
            print(f"::warning::environments.{active_env} not in config.yaml; skipping push-code.")
            with open(os.environ["GITHUB_ENV"], "a") as ef:
              ef.write("PUSH_TO_NEXT_BRANCH=false\n")
              ef.write("NEXT_BRANCH_NAME=\n")
            exit(0)

          block = environments[active_env]
          push = block.get("push_to_next_branch") is True
          next_branch = (block.get("next_branch_name") or "").strip()

          if not push:
            print(f"push_to_next_branch is false for env={active_env}; skipping push-code.")
          elif not next_branch:
            print(f"next_branch_name is empty for env={active_env}; skipping push-code.")
            push = False

          with open(os.environ["GITHUB_ENV"], "a") as ef:
            ef.write(f"PUSH_TO_NEXT_BRANCH={str(push).lower()}\n")
            ef.write(f"NEXT_BRANCH_NAME={next_branch}\n")
          PY

      - name: Fetch and push to next branch
        if: env.PUSH_TO_NEXT_BRANCH == 'true' && env.NEXT_BRANCH_NAME != ''
        run: |
          CURRENT="${{ github.ref_name }}"
          NEXT="${{ env.NEXT_BRANCH_NAME }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin
          if git branch -r | grep -q "origin/$NEXT"; then
            echo "Branch origin/$NEXT exists: merge $CURRENT into $NEXT and push."
            git checkout "$NEXT"
            git merge "$CURRENT" -m "chore: merge $CURRENT into $NEXT [skip ci]"
            git push origin "$NEXT"
          else
            echo "Branch $NEXT does not exist: create from $CURRENT and push."
            git checkout -b "$NEXT"
            git push -u origin "$NEXT"
          fi


